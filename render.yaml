services:
  - type: web
    name: codelens-rag-assistant
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-004
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: CHROMA_PERSIST_DIR
        value: ./data/chroma
      - key: REPOS_DIR
        value: ./data/repos
      - key: PORT
        value: 8000
    healthCheckPath: /health
